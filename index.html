<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조군 러한사전</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8A2B22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="조군 러한사전">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Nanum+Myeongjo:wght@400;700;800&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE8DA;
    --paper-deep:#E4DCC6;
    --ink:#23211C;
    --ink-soft:#5F5947;
    --rule:#C6BCA0;
    --red:#8A2B22;
    --gilt:#A8873F;
    --index-w:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-deep);
    color:var(--ink);
    font-family:"Nanum Myeongjo",serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .book{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(168,135,63,.05), transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(138,43,34,.04), transparent 55%);
    border-left:1px solid var(--rule);
    border-right:1px solid var(--rule);
    padding:env(safe-area-inset-top) calc(var(--index-w) + 10px) calc(60px + env(safe-area-inset-bottom)) 18px;
    position:relative;
  }

  /* ── 표지 머리 ── */
  header{padding:22px 0 10px;}
  .gilt{height:3px;background:linear-gradient(90deg,var(--gilt),#D9C07A,var(--gilt));}
  h1{
    font-family:"Nanum Myeongjo",serif;
    font-weight:800;font-size:26px;letter-spacing:.22em;
    margin:14px 0 2px;color:var(--red);
  }
  .sub{
    font-family:"PT Sans Narrow",sans-serif;
    font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* ── 검색 ── */
  .search{display:flex;gap:0;margin:18px 0 4px;border-bottom:2px solid var(--ink);}
  .search input{
    flex:1;border:0;background:transparent;outline:none;
    font-family:"Old Standard TT",serif;font-size:22px;color:var(--ink);
    padding:6px 2px;
  }
  .search input::placeholder{color:#A79C82;font-style:italic;}
  .search button{
    border:0;background:transparent;cursor:pointer;
    font-family:"PT Sans Narrow",sans-serif;font-size:13px;letter-spacing:.14em;
    color:var(--red);padding:0 4px;
  }
  .search button:disabled{color:#B0A691;cursor:default;}

  /* ── 난외 표제 (running head) ── */
  .runhead{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"PT Sans Narrow",sans-serif;font-size:11.5px;letter-spacing:.18em;
    color:var(--ink-soft);text-transform:uppercase;
    border-bottom:1px solid var(--rule);padding:8px 0 5px;margin-bottom:16px;
  }
  .runhead .off{color:var(--red);}

  /* ── 표제어 ── */
  .entry{animation:leaf .32s ease-out;}
  @keyframes leaf{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.entry{animation:none;}}

  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;}
  .word{
    font-family:"Old Standard TT",serif;font-weight:700;font-size:34px;
    color:var(--red);line-height:1.1;
  }
  .pron{font-family:"Nanum Myeongjo",serif;font-size:14px;color:var(--ink-soft);}
  .pos{
    font-family:"PT Sans Narrow",sans-serif;font-style:italic;font-size:14px;
    color:var(--ink);background:var(--paper-deep);padding:1px 7px;border-radius:2px;
  }
  .gram{
    font-family:"Old Standard TT",serif;font-style:italic;font-size:15px;
    color:var(--ink-soft);margin-top:8px;line-height:1.55;
  }

  /* ── 뜻풀이 ── */
  .senses{margin:18px 0 0;padding:0;list-style:none;}
  .sense{display:flex;gap:9px;margin-bottom:16px;}
  .num{
    font-family:"Old Standard TT",serif;font-weight:700;font-size:16px;
    color:var(--red);min-width:16px;padding-top:1px;
  }
  .gloss{font-size:17px;font-weight:700;line-height:1.5;}
  .note{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-top:2px;}
  .ex{margin:9px 0 0;padding-left:11px;border-left:2px solid var(--rule);}
  .ex-ru{
    font-family:"Old Standard TT",serif;font-style:italic;font-size:16.5px;
    line-height:1.5;
  }
  .ex-ko{font-size:14px;color:var(--ink-soft);line-height:1.55;margin-top:1px;}
  .w{cursor:pointer;border-bottom:1px dotted transparent;}
  .w:hover,.w:focus{border-bottom-color:var(--red);color:var(--red);outline:none;}

  /* ── 부록 블록 ── */
  .block{margin-top:26px;border-top:1px solid var(--rule);padding-top:12px;}
  .block h2{
    font-family:"PT Sans Narrow",sans-serif;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--red);margin:0 0 9px;font-weight:700;
  }
  .idiom{margin-bottom:10px;}
  .forms{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;}
  .forms dt{font-family:"PT Sans Narrow",sans-serif;color:var(--ink-soft);font-size:13.5px;padding-top:2px;}
  .forms dd{margin:0;font-family:"Old Standard TT",serif;}

  /* ── 상태 ── */
  .msg{font-size:15px;color:var(--ink-soft);line-height:1.8;padding:24px 0;}
  .msg b{color:var(--ink);}
  .seed{
    display:inline-block;margin:6px 8px 0 0;padding:3px 10px;
    border:1px solid var(--rule);border-radius:2px;cursor:pointer;
    font-family:"Old Standard TT",serif;font-size:16px;background:transparent;color:var(--ink);
  }
  .seed:hover{border-color:var(--red);color:var(--red);}

  /* ── 책배 색인 ── */
  .index{
    position:fixed;top:0;bottom:0;right:calc(50vw - 360px);width:var(--index-w);
    display:flex;flex-direction:column;justify-content:center;align-items:stretch;
    background:var(--paper-deep);border-left:1px solid var(--rule);
    font-family:"Old Standard TT",serif;font-size:9.5px;z-index:5;
  }
  @media (max-width:760px){.index{right:0;}}
  .index button{
    border:0;background:transparent;color:#8F8570;cursor:pointer;
    padding:0;line-height:1.42;font-family:inherit;font-size:inherit;
  }
  .index button.on{background:var(--red);color:var(--paper);font-weight:700;}

  .pageno{
    text-align:center;font-family:"PT Sans Narrow",sans-serif;font-size:11px;
    color:var(--ink-soft);letter-spacing:.2em;margin-top:34px;
  }

  .credit{
    margin-top:22px;padding-top:8px;border-top:1px solid var(--rule);
    font-family:"PT Sans Narrow",sans-serif;font-size:11px;letter-spacing:.06em;
    color:#9A9078;
  }
  .credit a{color:inherit;}

  /* ── 홈 화면에 추가 안내 ── */
  .install{
    margin-top:22px;border-top:1px solid var(--rule);padding-top:12px;
    font-size:13px;color:var(--ink-soft);line-height:1.7;
  }
  .install[hidden]{display:none;}
  .install button{
    font-family:"PT Sans Narrow",sans-serif;font-size:13px;letter-spacing:.1em;
    border:1px solid var(--red);background:transparent;color:var(--red);
    padding:4px 12px;border-radius:2px;cursor:pointer;margin-top:6px;
  }
</style>
</head>
<body>
<div class="book">
  <header>
    <div class="gilt"></div>
    <h1>조군 러한사전</h1>
    <div class="sub">Русско-корейский учебный словарь</div>
    <div class="search">
      <input id="q" type="text" placeholder="слово / 낱말" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="go">찾기</button>
    </div>
  </header>

  <div class="runhead"><span id="rh-l">—</span><span id="rh-r">учебный словарь</span></div>

  <main id="out">
    <div class="msg">
      러시아어 낱말을 넣으면 <b>강세·품사·여러 갈래의 뜻·예문</b>을 종이 사전처럼 펼쳐 보여줍니다.
      한국어로 찾아도 됩니다. 예문 속 낱말을 누르면 그 낱말로 이어서 찾아갑니다.
      자주 쓰는 낱말은 이 책 안에 이미 실려 있어, 인터넷 없이도 곧바로 열립니다.
      <div style="margin-top:10px">
        <button class="seed">книга</button><button class="seed">идти</button>
        <button class="seed">свет</button><button class="seed">друг</button><button class="seed">쓰다</button>
      </div>
    </div>
  </main>

  <div class="pageno" id="pageno">— 1 —</div>

  <div class="install" id="install" hidden>
    <span id="install-text"></span>
    <div><button id="install-go" hidden>홈 화면에 추가</button></div>
  </div>
</div>

<nav class="index" id="index" aria-label="자모 색인"></nav>

<script>
/* ── 낱말을 물어볼 창구 ────────────────────────────────
   PROXY : 직접 만든 서버 창구(열쇠는 서버에만 둔다)
   먼저 PROXY 로 물어보고, 없으면 API 로 곧장 물어본다.      */
const PROXY = "./api/lookup";
const API   = "https://api.anthropic.com/v1/messages";

const AZ = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ".split("");
const idx = document.getElementById("index");
AZ.forEach(l=>{
  const b=document.createElement("button");
  b.textContent=l; b.dataset.l=l; b.title=l+"로 시작하는 낱말";
  b.onclick=()=>{const i=document.getElementById("q"); i.value=l.toLowerCase(); i.focus();};
  idx.appendChild(b);
});

const $ = s=>document.querySelector(s);
const out=$("#out"), qEl=$("#q"), goEl=$("#go");
let page = 1;

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 미리 만들어 둔 사전 (words.json). 여기 있으면 인터넷도 요금도 필요 없다. */
let BOOK = {entries:{}, alias:{}};
const bookReady = fetch("words.json")
  .then(r=>r.json()).then(j=>{ BOOK=j; markReady(); })
  .catch(()=>{});

function fromBook(term){
  const t = term.replace(/\u0301/g,"").toLowerCase();
  return BOOK.entries[t] || BOOK.entries[BOOK.alias[t]] || null;
}
function markReady(){
  const n = Object.keys(BOOK.entries).length;
  if(n){ $("#rh-r").dataset.n = n; connState(); }
}

/* 찾아본 낱말을 이 기기에 남겨 둔다 (인터넷 없이 다시 열기 위해) */
const shelf = {
  get(w){ try{ const v=localStorage.getItem("ruko:"+w); return v?JSON.parse(v):null; }catch(_){ return null; } },
  put(w,o){ try{ localStorage.setItem("ruko:"+w, JSON.stringify(o)); }catch(_){} }
};

function linkify(text){
  return esc(text).split(/(\s+)/).map(tok=>{
    const bare = tok.replace(/[^\u0400-\u04FF\u0301-]/g,"");
    if(bare.length<2) return tok;
    const clean = bare.replace(/\u0301/g,"").toLowerCase();
    return `<span class="w" tabindex="0" data-w="${clean}">${tok}</span>`;
  }).join("");
}

function setHead(w){
  $("#rh-l").textContent = w || "—";
  const first = (w||"").replace(/\u0301/g,"")[0];
  [...idx.children].forEach(b=>b.classList.toggle("on", first && b.dataset.l===first.toUpperCase()));
}

function askPrompt(term){
  return `너는 러시아어–한국어 학습 사전의 편찬자다. 찾는 말: "${term}"

한국어로 입력되면 그에 해당하는 가장 대표적인 러시아어 낱말을 표제어로 삼는다.
초·중급 학습자(청소년)가 읽을 수준으로, 예문은 짧고 쉽게.
뜻은 자주 쓰이는 순서로 최대 4개, 각 뜻마다 예문 1~2개.

아래 JSON만 출력한다. 서문·마크다운·설명 없이 JSON 객체 하나만.
{
 "found": true,
 "headword": "강세 부호 없는 원형",
 "stressed": "강세 부호(U+0301)를 넣은 표제어",
 "pron": "한글 근사 발음",
 "pos": "러시아 사전식 약어(сущ., гл., прил., нареч. 등)",
 "pos_ko": "한국어 품사",
 "gram": "문법 정보 한 줄(성·수, 동사면 상 짝과 활용 유형 등)",
 "senses": [{"gloss":"한국어 뜻","note":"쓰임 설명(없으면 빈 문자열)","examples":[{"ru":"러시아어 예문(강세 부호 포함)","ko":"한국어 번역"}]}],
 "idioms": [{"ru":"관용구","ko":"뜻"}],
 "forms": [{"label":"변화형 이름","value":"형태"}],
 "etym": "어원이나 기억에 도움되는 한 줄(없으면 빈 문자열)"
}
낱말을 찾을 수 없으면 {"found":false,"suggest":"가장 비슷한 낱말","msg":"짧은 안내"}`;
}

async function ask(term){
  const bodies = [
    [PROXY, JSON.stringify({term})],
    [API,   JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,
             messages:[{role:"user",content:askPrompt(term)}]})]
  ];
  let last;
  for(const [url, body] of bodies){
    try{
      const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body});
      const data = await r.json();
      if(data && data.content) return data;
      last = new Error((data && data.error && (data.error.message||data.error)) || "빈 응답");
    }catch(e){ last = e; }
  }
  throw last || new Error("연결하지 못했습니다");
}

async function lookup(term){
  term=(term||"").trim();
  if(!term) return;
  qEl.value=term;

  await bookReady;                        // 미리 만들어 둔 사전을 먼저 뒤진다
  const built = fromBook(term);
  if(built){ render(built, term, true); return; }

  const saved = shelf.get(term);          // 전에 찾아본 낱말이면 바로 펼친다
  if(saved){ render(saved, term); return; }

  if(!navigator.onLine){
    out.innerHTML='<div class="msg">이 사전에 아직 없는 낱말입니다. 인터넷이 연결되면 새 낱말도 찾아볼 수 있습니다.</div>';
    return;
  }

  goEl.disabled=true; goEl.textContent="…";
  out.innerHTML='<div class="msg">책장을 넘기는 중…</div>';
  try{
    const data = await ask(term);
    let raw = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    raw = raw.replace(/```json|```/g,"").trim();
    const s=raw.indexOf("{"), e=raw.lastIndexOf("}");
    const obj = JSON.parse(raw.slice(s, e+1));
    shelf.put(term, obj);
    if(obj.headword && obj.headword!==term) shelf.put(obj.headword, obj);
    render(obj, term);
  }catch(err){
    console.error(err);
    out.innerHTML='<div class="msg">찾지 못했습니다. 철자를 확인하고 다시 눌러 주세요.'
      +'<div style="font-size:12.5px;margin-top:6px;color:#8F8570">'+esc(err.message||err)+'</div></div>';
  }finally{
    goEl.disabled=false; goEl.textContent="찾기";
  }
}

function render(d, term, built){
  if(d.found===false){
    out.innerHTML=`<div class="msg">「${esc(term)}」은(는) 이 사전에 없습니다. ${esc(d.msg||"")}
      ${d.suggest?`<div style="margin-top:8px"><button class="seed">${esc(d.suggest)}</button></div>`:""}</div>`;
    setHead(""); return;
  }
  const senses=(d.senses||[]).map((s,i)=>`
    <li class="sense">
      <span class="num">${i+1}</span>
      <div>
        <div class="gloss">${esc(s.gloss)}</div>
        ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
        ${(s.examples||[]).map(x=>`<div class="ex">
            <div class="ex-ru">${linkify(x.ru)}</div>
            <div class="ex-ko">${esc(x.ko)}</div>
          </div>`).join("")}
      </div>
    </li>`).join("");

  out.innerHTML=`
    <article class="entry">
      <div class="head">
        <span class="word">${esc(d.stressed||d.headword)}</span>
        ${d.pron?`<span class="pron">[${esc(d.pron)}]</span>`:""}
        ${d.pos?`<span class="pos">${esc(d.pos)}</span>`:""}
      </div>
      ${d.gram?`<div class="gram">${esc(d.gram)}${d.pos_ko?` · ${esc(d.pos_ko)}`:""}</div>`:""}
      <ol class="senses">${senses}</ol>
      ${(d.idioms||[]).length?`<section class="block"><h2>관용 표현</h2>
        ${d.idioms.map(x=>`<div class="idiom"><div class="ex-ru">${linkify(x.ru)}</div><div class="ex-ko">${esc(x.ko)}</div></div>`).join("")}
      </section>`:""}
      ${(d.forms||[]).length?`<section class="block"><h2>변화형</h2>
        <dl class="forms">${d.forms.map(f=>`<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join("")}</dl>
      </section>`:""}
      ${d.etym?`<section class="block"><h2>낱말의 뿌리</h2><div class="note">${esc(d.etym)}</div></section>`:""}
      ${built?`<div class="credit">변화형·강세 자료 <a href="https://en.openrussian.org" target="_blank" rel="noopener">OpenRussian.org</a> · CC BY-SA 4.0</div>`:""}
    </article>`;
  setHead(d.headword||term);
  $("#pageno").textContent = `— ${++page} —`;
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click",e=>{
  if(e.target.classList.contains("seed")) lookup(e.target.textContent);
  if(e.target.classList.contains("w")) lookup(e.target.dataset.w);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.classList.contains("w")) lookup(e.target.dataset.w);
});
goEl.onclick=()=>lookup(qEl.value);
qEl.addEventListener("keydown",e=>{if(e.key==="Enter")lookup(qEl.value);});

/* ── 연결 상태 ── */
function connState(){
  const n = $("#rh-r").dataset.n;
  $("#rh-r").textContent = navigator.onLine
    ? "учебный словарь"
    : (n ? `오프라인 · 수록 ${n}낱말` : "오프라인");
  $("#rh-r").className = navigator.onLine ? "" : "off";
}
addEventListener("online",connState); addEventListener("offline",connState); connState();

/* ── 홈 화면에 추가 ── */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let deferred = null;

addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferred = e;
  $("#install").hidden = false;
  $("#install-text").textContent = "이 사전을 홈 화면에 두면 앱처럼 열립니다.";
  $("#install-go").hidden = false;
});
$("#install-go").onclick = async()=>{
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice;
  deferred = null; $("#install").hidden = true;
};
if(isIOS && !standalone){
  $("#install").hidden = false;
  $("#install-text").textContent = "아래 공유 단추를 누르고 ‘홈 화면에 추가’를 고르면 앱처럼 열립니다.";
}

/* ── 서비스 워커 ── */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
